




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt a Pet</title>
    <style>
        /* Add some vibrant styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
        }
        .form-container {
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: #fff;
            text-align: center;
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease-in-out;
        }
        .form-container:hover {
            transform: translateY(-5px);
        }
        .form-container h2 {
            margin-bottom: 20px;
            color: #ff4b2b;
        }
        .form-container input {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .form-container input:focus {
            border-color: #ff4b2b;
        }
        .form-container button {
            padding: 15px;
            width: 100%;
            background-color: #ff4b2b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .form-container button:hover {
            background-color: #ff1e56;
        }
        #message {
            opacity: 0;
            transition: opacity 1s;
            margin-top: 20px;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Adopt a Pet</h2>
        <form id="adoptForm">
            <label for="yourName">Your Name:</label>
            <input type="text" id="yourName" name="yourName" value="Sanjaykumar VT" required>
            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" value="sanjaykumar18136@gmail.com" required>
            <button type="submit">Submit</button>
        </form>
        <div id="message">Our employees would reach you as soon as possible</div>
    </div>

    <script>
        document.getElementById('adoptForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const yourName = document.getElementById('yourName').value;
            const email = document.getElementById('email').value;

            // Display the success message with transition
            const messageDiv = document.getElementById('message');
            messageDiv.style.opacity = 1;
        });
    </script>
</body>
</html>
